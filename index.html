<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>REVACHOL - 原创角色档案馆</title>

    <!-- ===== 字体 ===== -->
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&family=Patrick+Hand&display=swap" rel="stylesheet">

    <!-- ===== 三套主题预加载（disabled toggle 零网络请求切换） ===== -->
    <link rel="stylesheet" href="/css/themes/dark.css" id="theme-stylesheet-dark">
    <link rel="stylesheet" href="/css/themes/light.css" id="theme-stylesheet-light" disabled>
    <link rel="stylesheet" href="/css/themes/lofi.css" id="theme-stylesheet-lofi" disabled>

    <!-- ===== 主样式 ===== -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components/puzzle.css">
    <link rel="stylesheet" href="css/components/deco-resize.css">
    <link rel="stylesheet" href="css/components/magic-box.css">
    <link rel="stylesheet" href="css/components/health-indicator.css">
</head>
<body>

<!-- 主题预加载：心跳动画背景色跟随保存的主题，消除暗色闪烁 -->
<style id="theme-preload">
  html[data-theme="dark"] .heartbeat-loader  { background: #1a1612; }
  html[data-theme="light"] .heartbeat-loader { background: #f5f0e8; }
  html[data-theme="lofi"] .heartbeat-loader  { background: #f0ead8; }
</style>
<script>
  (function(){var r=localStorage.getItem('rv_selected_theme'),t='dark';
  if(r){try{t=JSON.parse(r)}catch(e){t=r.replace(/"/g,'');}}
  document.documentElement.setAttribute('data-theme',t);})();
</script>

<!-- 平铺式背景水印层 -->
<div class="tiled-watermark" id="tiledWatermark"></div>
<div class="custom-texture" id="customTexture"></div>
<div class="visible-watermark" id="visibleWatermark"></div>

<!-- 心跳加载动画 — 双层波形 + 脉冲光晕，立即可见 -->
<div id="heartbeat-loader" class="heartbeat-loader">
    <svg viewBox="0 0 400 120" class="heartbeat-svg" xmlns="http://www.w3.org/2000/svg">
        <polyline points="0,60 20,60 30,60 35,20 45,100 55,60 75,60 85,60 90,30 100,90 110,60 140,60 160,60 170,60 175,25 185,95 195,60 220,60 240,60 250,60 255,35 265,85 275,60 300,60 310,60 315,30 325,90 335,60 380,60 400,60"
                  fill="none" stroke="var(--color-accent, #c47a44)" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        <polyline points="0,60 20,60 30,60 35,20 45,100 55,60 75,60 85,60 90,30 100,90 110,60 140,60 160,60 170,60 175,25 185,95 195,60 220,60 240,60 250,60 255,35 265,85 275,60 300,60 310,60 315,30 325,90 335,60 380,60 400,60"
                  fill="none" stroke="var(--color-accent, #c47a44)" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round" opacity="0">
            <animate attributeName="opacity" values="0;0.9;0" dur="1s" repeatCount="indefinite"/>
        </polyline>
        <circle cx="50" cy="60" r="4" fill="var(--color-accent, #c47a44)" opacity="0.8">
            <animate attributeName="r" values="4;16;4" dur="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="60" r="5" fill="var(--color-accent, #c47a44)">
            <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    <p class="heartbeat-text">加载中</p>
</div>

<!-- ========== 左上角工具栏 ========== -->
<div class="side-toolbar collapsed" id="sideToolbar">
    <div class="toolbar-toggle" id="toolbarToggle" title="工具栏">
        <div class="toolbar-toggle-icon"></div>
    </div>
    <div class="toolbar-panel" id="toolbarPanel">
        <div class="toolbar-tools">
            <button class="tool-item active" data-tool="help" title="使用说明">?</button>
        </div>
        <div class="toolbar-content" id="toolbarContent"></div>
    </div>
</div>

<!-- ========== 全屏视频背景 ========== -->
<div class="fullscreen-bg" id="fullscreenBg">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto">
        <source src="videos/hero-bg-desktop.webm" type="video/webm" media="(min-width: 768px)">
        <source src="videos/hero-bg-mobile.webm" type="video/webm" media="(max-width: 767px)">
        <source src="videos/hero-bg-desktop.mp4" type="video/mp4" media="(min-width: 768px)">
        <source src="videos/hero-bg-mobile.mp4" type="video/mp4" media="(max-width: 767px)">
    </video>
</div>

<!-- 自定义贴图层 -->
<div class="deco-logo" id="decoLogo"></div>
<div class="deco-stamp" id="decoStamp"></div>
<div class="deco-raven" id="decoRaven"></div>

<!-- ========== 右上角登录UI ========== -->
<div class="login-widget" id="loginWidget">
    <div class="login-trigger" id="loginTrigger">
        <img class="login-avatar" id="loginAvatar" src="images/default-avatar.png" alt="头像">
        <div class="login-info">
            <span class="login-label" id="loginLabel"></span>
            <span class="welcome-text" id="welcomeText"></span>
        </div>
    </div>
</div>

<!-- ========== 健康状态指示器 ========== -->
<div class="health-indicator" id="healthIndicator" title="正在检测服务状态...">
    <span class="health-dot"></span>
    <span class="health-label">检测中...</span>
    <span class="health-detail"></span>
</div>

<!-- ========== 登录弹窗 ========== -->
<div class="modal-overlay" id="loginModalOverlay">
    <div class="login-modal" id="loginModal">
        <div class="modal-header">
            <h3 id="loginModalTitle"></h3>
            <button class="modal-close" id="modalCloseBtn">✕</button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label id="loginUsernameLabel"></label>
                <input type="text" id="loginUsername" placeholder="">
            </div>
            <div class="input-group">
                <label id="loginPasswordLabel"></label>
                <input type="password" id="loginPassword" placeholder="">
            </div>
            <button class="login-submit-btn" id="modalLoginBtn"></button>
            <div class="login-hint" id="loginHint"></div>
        </div>
    </div>
</div>

<!-- ========== 头像裁剪弹窗 ========== -->
<div class="modal-overlay" id="avatarCropModalOverlay">
    <div class="crop-modal" id="avatarCropModal">
        <div class="modal-header">
            <h3 id="cropModalTitle"></h3>
            <button class="modal-close" id="cropModalCloseBtn">✕</button>
        </div>
        <div class="modal-body">
            <div class="crop-container">
                <canvas id="cropCanvas"></canvas>
            </div>
            <div class="crop-preview">
                <p id="cropPreviewLabel"></p>
                <canvas id="previewCanvas" width="80" height="80"></canvas>
            </div>
            <div class="crop-actions">
                <button class="crop-cancel-btn" id="cropCancelBtn"></button>
                <button class="crop-confirm-btn" id="cropConfirmBtn"></button>
            </div>
        </div>
    </div>
</div>

<!-- ========== 文章详情子页面 ========== -->
<div class="detail-overlay" id="detailOverlay">
    <div class="detail-container">
        <div class="detail-tabs" id="detailTabs"></div>
        <div class="detail-panes" id="detailPanes"></div>
    </div>
</div>

<!-- ========== 管理员控制台 ========== -->
<div class="admin-panel open collapsed" id="adminPanel" style="right:20px;bottom:20px;">
    <div class="panel-header" id="panelHeader">
        <h4 id="adminPanelTitle"></h4>
        <span class="toggle-icon" id="panelToggleIcon">▶</span>
    </div>
    <div class="panel-content" id="panelContent"></div>
</div>

<!-- ========== 应用布局 ========== -->
<div class="app-layout">
    <!-- 悬浮侧边栏 -->
    <div class="sidebar open collapsed" id="sidebar">
        <div class="sidebar-header">
            <h3 id="sidebarTitle"></h3>
            <div class="sidebar-header-actions">
                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="展开/收起">◀</button>
            </div>
        </div>
        <div class="sidebar-body">
            <div class="sidebar-search">
                <input type="text" id="sidebarSearchInput" class="sidebar-search-box" placeholder="" autocomplete="off">
            </div>
            <div id="positionModeControls" style="display:none; padding: 8px 12px; border-bottom:1px solid #3a2a1a;">
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                    <button id="enterPositionModeBtn" class="pos-mode-btn pos-mode-enter">📌 进入位置管理</button>
                    <button id="savePositionChangesBtn" class="pos-mode-btn pos-mode-save" style="display:none;">💾 保存更改</button>
                    <button id="cancelPositionChangesBtn" class="pos-mode-btn pos-mode-cancel" style="display:none;">❌ 取消</button>
                </div>
                <div class="pos-mode-hint" id="positionModeHint"></div>
            </div>
            <div class="directory-tree" id="directoryTree">
                <div style="padding: 20px; text-align: center; color: #7a6a58;" id="directoryLoading"></div>
            </div>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 右侧主要内容 -->
    <div class="main-content">
        <div class="copyright-bar" id="copyrightBar"></div>

        <div class="toolbar">
            <div class="header-decoration">
                <div class="avatar" id="siteAvatar">
                    <img id="siteAvatarImg" src="" alt="站点图标" style="display:none;">
                    <span id="siteAvatarFallback">🎭</span>
                </div>
                <h1 id="siteTitle"></h1>
                <p class="subtitle" id="siteSubtitle"></p>
            </div>
            <div style="width: 44px;"></div>
        </div>

        <!-- 首屏说明区域 -->
        <div class="hero-section">
            <div class="hero-content">
                <h2 id="heroTitle"></h2>
                <div class="hero-description" id="heroDescription"></div>
            </div>
        </div>

        <div id="articlesContainer" class="articles-grid">
            <div class="loading" id="articlesLoading"></div>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
