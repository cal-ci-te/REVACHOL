[project]
name = "my_first_crew"
version = "0.1.0"
description = "my_first_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.15.17,<2.0.0",
    "crewai[litellm,tools]>=1.15.17,<2.0.0",
    "prompt-toolkit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "873685ac-e80b-4294-9c31-a12cd4ba7b5c"
