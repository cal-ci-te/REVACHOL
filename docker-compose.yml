services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9999:9999"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # CrewAI 源码热挂载（.env 密钥随目录进入容器）
      - ./my_first_crew:/app/my_first_crew
      # 匿名卷：保留镜像内 Linux venv，避免被宿主机 Windows .venv 覆盖
      - /app/my_first_crew/.venv
      # 结构化输出落盘到宿主机 output/
      - ./output:/app/my_first_crew/output
      - revachol_data:/app/data
      - revachol_uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/revachol.db
      - STORAGE_TYPE=local
      - HOST=0.0.0.0
      # Crew Dashboard：Python 子进程
      - CREWAI_DISABLE_ASYNC=1
      - PYTHONUNBUFFERED=1
      - CREW_PYTHON=/app/my_first_crew/.venv/bin/python
      - CREW_DIR=/app/my_first_crew
      - CREW_OUTPUT_DIR=/app/my_first_crew/output
      # RFC-001 默认引擎：crew | flow（灰度迁移第 3 步环境开关）
      - CREW_ENGINE=${CREW_ENGINE:-crew}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9999/api/crew/status',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);process.exit(j&&typeof j.running==='boolean'?0:1)}catch(_){process.exit(1)}})}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:9999
      # 容器内无浏览器：关闭 Vite 自动打开浏览器（避免 xdg-open ENOENT 报错）
      - VITE_OPEN_BROWSER=false
      # 不设置 VITE_WS_URL：浏览器通过 Vite /websocket 代理同源连接，
      # 避免把容器内服务名（backend）暴露给宿主机浏览器
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Vite 已配置 /api 与 /websocket 代理（vite.config.js），/api/crew/* 自动转发到 backend:9999

  # ============================================================
  # Playwright E2E 测试容器
  # 依赖 backend + frontend 就绪，运行测试后自动退出
  # 用法：
  #   docker compose run --rm playwright-tests              # 运行测试
  #   docker compose run --rm playwright-tests --archive     # 运行测试 + 归档
  #   docker compose build playwright-tests                  # 仅构建镜像
  # ============================================================
  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      # 测试结果持久化到宿主机
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./run-history:/app/run-history
    environment:
      - CI=true
      - BASE_URL=http://frontend:3000
    # 测试容器是一次性的，完成后自动退出
    restart: "no"
    # 默认运行 Docker 专用配置
    command: ["npx", "playwright", "test", "--config", "e2e-tests/playwright.docker.config.js"]

volumes:
  revachol_data:
  revachol_uploads:
